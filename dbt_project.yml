name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'  # Make sure this matches the profile name in dbt Cloud

# File path configs
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Default model config (applies to everything in models/)
models:
  my_new_project:
    +materialized: view  # Change to 'table' if needed

# Enable snapshots (if using any)
snapshots:
  my_new_project:
    +enabled: true
